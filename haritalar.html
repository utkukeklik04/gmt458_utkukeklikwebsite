    <style>
        .map-wrapper {
            width: 100%;
            height: 500px;
            margin: 10px 0 40px 0;
            border-radius: 16px;
            border: 2px solid rgba(226, 232, 240, 0.8);
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            position: relative;
            z-index: 15;
            background: #aad3df;
        }
        .map-title {
            font-size: 19px;
            font-weight: 700;
            color: #1e3c72;
            margin-bottom: 15px;
            margin-top: 30px;
        }
        .map-filters {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 8px 18px;
            border-radius: 20px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 13px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .filter-visited.active { background: #e11d48; color: white; }
        .filter-wishlist.active { background: #3b82f6; color: white; }
        .filter-btn.inactive { background: #e2e8f0; color: #64748b; box-shadow: none; }

        .ol-popup {
            position: absolute;
            background-color: white;
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
            padding: 16px;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            bottom: 12px;
            left: -50px;
            min-width: 260px;
            max-width: 280px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: opacity 0.2s;
        }
        .ol-popup:after, .ol-popup:before {
            top: 100%;
            border: solid transparent;
            content: " ";
            height: 0;
            width: 0;
            position: absolute;
            pointer-events: none;
        }
        .ol-popup:after { border-top-color: white; border-width: 10px; left: 48px; margin-left: -10px; }
        .ol-popup:before { border-top-color: #e2e8f0; border-width: 11px; left: 48px; margin-left: -11px; }
        
        .ol-popup-closer {
            text-decoration: none;
            position: absolute;
            top: 10px;
            right: 12px;
            color: #94a3b8;
            font-size: 16px;
            font-weight: bold;
            transition: color 0.2s;
        }
        .ol-popup-closer:hover { color: #0f172a; }
        .ol-popup-closer:after { content: "✖"; }
        
        .city-name { font-size: 18px; font-weight: 800; color: #0f172a; margin: 0 0 4px 0; }
        .city-pop { font-size: 12px; font-weight: 700; margin: 0 0 10px 0; display: inline-block; padding: 3px 8px; border-radius: 6px; }
        .pop-visited { background: #ffe4e6; color: #e11d48; }
        .pop-wishlist { background: #dbeafe; color: #2563eb; }
        
        .city-img { width: 100%; height: 130px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; background: #f1f5f9; display: block; transition: transform 0.2s ease; cursor: pointer; }
        .city-img:hover { transform: scale(1.03); }
        .city-desc { font-size: 13px; color: #475569; line-height: 1.5; margin: 0; }
        .loading-text { font-size: 12px; color: #64748b; font-style: italic; margin-top: 5px; }

        .leaflet-popup-content-wrapper { border-radius: 14px; padding: 4px; box-shadow: 0 8px 25px rgba(0,0,0,0.25); }
        .leaflet-popup-content { font-family: 'Plus Jakarta Sans', sans-serif; margin: 10px 14px; }
        
        #leaflet-map, #ol-map {
             width: 100%;
             height: 500px;

    <script>
        function setLanguage(lang) {
            localStorage.setItem('siteLanguage', lang);
            const isTr = lang === 'tr';
            
            document.querySelector('h1').innerText = isTr ? "Haritalarım" : "My Maps";
            document.querySelector('h1 + p').innerText = isTr ? "Vikipedi API entegrasyonlu haritalarım." : "My maps with Wikipedia API integration.";
            
            document.getElementById('title-leaflet').innerText = isTr ? "Staj Yaptığım Şehirler (Leaflet)" : "Cities Where I Interned (Leaflet)";
            document.getElementById('title-ol').innerText = isTr ? "Küresel Seyahat & Hedef Haritası (OpenLayers)" : "Global Travel & Wishlist Map (OpenLayers)";
            
            document.getElementById('btn-visited').innerHTML = isTr ? "📍 Gittiğim Yerler" : "📍 Visited Cities";
            document.getElementById('btn-wishlist').innerHTML = isTr ? "🌟 Gitmek İstediğim Yerler" : "🌟 Wishlist Cities";
            
            document.querySelectorAll('nav a').forEach((el, index) => {
                const trNav = ["Hakkımda", "Yetenekler", "Stajlarım", "Haritalar"];
                const enNav = ["About Me", "Skills", "Internships", "Maps"];
                el.innerText = isTr ? trNav[index] : enNav[index];
            });
        }

        function initScrollObserver() {
            const elements = document.querySelectorAll('.scroll-reveal');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach((entry) => { if (entry.isIntersecting) entry.target.classList.add('is-visible'); });
            }, { threshold: 0.15 });
            elements.forEach(el => observer.observe(el));
        }

        let visitedVisible = true;
        let wishlistVisible = true;
        let vectorLayerVisited, vectorLayerWishlist;

        function toggleLayer(type) {
            if(type === 'visited') {
                visitedVisible = !visitedVisible;
                vectorLayerVisited.setVisible(visitedVisible);
                document.getElementById('btn-visited').className = `filter-btn filter-visited ${visitedVisible ? 'active' : 'inactive'}`;
            } else {
                wishlistVisible = !wishlistVisible;
                vectorLayerWishlist.setVisible(wishlistVisible);
                document.getElementById('btn-wishlist').className = `filter-btn filter-wishlist ${wishlistVisible ? 'active' : 'inactive'}`;
            }
        }

        async function fetchWikiData(cityName) {
            try {
                let query = encodeURIComponent(cityName);
                let lang = 'tr';
                let response = await fetch(`https://tr.wikipedia.org/api/rest_v1/page/summary/${query}`);
                if (!response.ok) {
                    response = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${query}`);
                    lang = 'en';
                }
                if (!response.ok) return null;
                
                let data = await response.json();
                return {
                    extract: data.extract ? (data.extract.substring(0, 120) + '...') : 'Bilgi bulunamadı.',
                    image: data.thumbnail ? data.thumbnail.source : null,
                    url: data.content_urls ? data.content_urls.desktop.page : `https://${lang}.wikipedia.org/wiki/${query}`
                };
            } catch (error) {
                return null;
            }
        }

                function createFeatures(cityArray, type) {
                    return cityArray.map(city => {
                        let feat = new ol.Feature({
                            geometry: new ol.geom.Point(ol.proj.fromLonLat(city.coords)),
                            name: city.name,
                            pop: city.pop,
                            type: type
                        });
                        return feat;
                    });
                }

                const visitedStyle = new ol.style.Style({
                    image: new ol.style.Circle({ radius: 7, fill: new ol.style.Fill({color: '#e11d48'}), stroke: new ol.style.Stroke({color: '#ffffff', width: 2}) })
                });
                
                const wishlistStyle = new ol.style.Style({
                    image: new ol.style.Circle({ radius: 7, fill: new ol.style.Fill({color: '#3b82f6'}), stroke: new ol.style.Stroke({color: '#ffffff', width: 2}) })
                });

                vectorLayerVisited = new ol.layer.Vector({ source: new ol.source.Vector({ features: createFeatures(visitedCities, 'visited'), wrapX: true }), style: visitedStyle });
                vectorLayerWishlist = new ol.layer.Vector({ source: new ol.source.Vector({ features: createFeatures(wishlistCities, 'wishlist'), wrapX: true }), style: wishlistStyle });

                var olMap = new ol.Map({
                    target: 'ol-map',
                    layers: [ new ol.layer.Tile({ source: new ol.source.OSM({ wrapX: true }) }), vectorLayerVisited, vectorLayerWishlist ],
                    view: new ol.View({ center: ol.proj.fromLonLat([10, 35]), zoom: 2.2, multiWorld: true })
                });

                const popupContainer = document.getElementById('popup');
                const popupContent = document.getElementById('popup-content');
                const popupCloser = document.getElementById('popup-closer');

                const overlay = new ol.Overlay({
                    element: popupContainer,
                    autoPan: { animation: { duration: 250 } },
                    positioning: 'bottom-center',
                    offset: [0, -15]
                });
                olMap.addOverlay(overlay);

                popupCloser.onclick = function() {
                    overlay.setPosition(undefined);
                    popupCloser.blur();
                    return false;
                };

                    const feature = olMap.forEachFeatureAtPixel(evt.pixel, function (feat) { return feat; });
                    
                    if (feature) {
                        const coords = feature.getGeometry().getCoordinates();
                        const cityName = feature.get('name');
                        const pop = feature.get('pop');
                        const type = feature.get('type');
                        const badgeClass = type === 'visited' ? 'pop-visited' : 'pop-wishlist';

                                ${imgHTML}
                                <h3 class="city-name">${cityName}</h3>
                                <span class="city-pop ${badgeClass}">👥 Nüfus: ${pop}</span>
                                <p class="city-desc">${wikiData.extract}</p>
                            `;
                        } else {
                            popupContent.innerHTML = `
                                <h3 class="city-name">${cityName}</h3>
                                <span class="city-pop ${badgeClass}">👥 Nüfus: ${pop}</span>
                                <p class="city-desc">Bu şehir için Wikipedia özeti bulunamadı.</p>
                            `;
                        }
                    } else {
                        overlay.setPosition(undefined);
                    }
                });

                olMap.on('pointermove', function (e) {
                    const pixel = olMap.getEventPixel(e.originalEvent);
                    const hit = olMap.hasFeatureAtPixel(pixel);
                    olMap.getTargetElement().style.cursor = hit ? 'pointer' : '';
                });
            }, 100);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedLanguage = localStorage.getItem('siteLanguage') || 'en';
            setLanguage(savedLanguage);
            initScrollObserver();
            initMaps();
        });
    </script>
</body>
</html>
